

import com.android.build.api.dsl.ManagedVirtualDevice

plugins {
    alias libs.plugins.ksp
    alias libs.plugins.androidApplication
    alias libs.plugins.kotlinAndroid
    alias libs.plugins.kotlinSerialization
    alias libs.plugins.kotlinParcelize
    alias libs.plugins.kotlinKapt
    alias libs.plugins.navigationSafeArgs
}

apply from: "${project.rootDir}/gradle_scripts/code_quality.gradle"

android {
    def signingProperties = new Properties()
    def envFile = rootProject.file(".env")
    if (envFile.exists()) {
        envFile.withInputStream { signingProperties.load(it) }
    }
    // Fallback to local.properties if it still exists (e.g. created by IDE)
    def localPropsFile = rootProject.file("local.properties")
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { signingProperties.load(it) }
    }

    def envOrProp = { String key, String defVal = null ->
        return System.getenv(key) ?: signingProperties.getProperty(key, defVal)
    }

    compileSdk = libs.versions.appCompileSdk.get().toInteger()

    defaultConfig {
        applicationId = 'nl.teunschriks.mumamobile'
        versionCode 150
        versionName "6.1.1"

        minSdk = libs.versions.appMinSdk.get().toInteger()
        targetSdk = libs.versions.appTargetSdk.get().toInteger()
        resourceConfigurations += ['cs', 'de', 'en', 'es', 'fr', 'gl', 'hu', 'it', 'ja', 'nb-rNO', 'nl', 'pl', 'pt', 'pt-rBR', 'ru', 'zh-rCN', 'zh-rTW']

        buildConfigField "String", "APK_HOST_URL", "\"${envOrProp('APK_HOSTER_URL', 'https://apk.teunschriks.nl')}\""
        buildConfigField "String", "APK_HOST_USER", "\"${envOrProp('APK_HOSTER_USER', 'ultrasonic')}\""
        buildConfigField "String", "APK_HOST_PASSWORD", "\"${envOrProp('APK_HOSTER_PASSWORD', '')}\""
    }

    def getServerJson = { boolean includePassword ->
        def serverEnvFile = rootProject.file(".server-env.json")
        if (!serverEnvFile.exists()) return "[]"
        
        def content = serverEnvFile.text
        if (!includePassword) {
            // Remove password field from JSON
            content = content.replaceAll(/"password"\s*:\s*"[^"]*"\s*,?/, '')
            // Clean up trailing commas if any
            content = content.replaceAll(/,\s*\}/, '}')
        }
        
        return content
            .replaceAll('\r?\n', '')
            .replaceAll('\\s+', ' ')
            .replaceAll('"', '\\\\"')
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    def storeLocation = envOrProp('SIGNING_STORE_FILE', rootProject.file('keystore.jks').path)
    File resolvedStoreFile = null
    if (storeLocation != null) {
        def candidate = new File(storeLocation)
        resolvedStoreFile = candidate.isAbsolute() ? candidate : rootProject.file(storeLocation)
    }

    signingConfigs {
        release {
            if (resolvedStoreFile != null) {
                storeFile = resolvedStoreFile
            }
            storePassword = envOrProp('SIGNING_STORE_PASSWORD')
            keyAlias = envOrProp('SIGNING_KEY_ALIAS')
            keyPassword = envOrProp('SIGNING_KEY_PASSWORD')
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
            if (this.respondsTo('enableV4Signing')) {
                enableV4Signing = true
            }
        }
        debug {
            if (resolvedStoreFile?.exists() && envOrProp('SIGNING_STORE_PASSWORD') != null) {
                initWith signingConfigs.release
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'minify/proguard-main.pro',
                    'minify/proguard-okhttp.pro',
                    'minify/proguard-retrofit.pro',
                    'minify/proguard-jackson.pro',
                    'minify/proguard-kotlin-reflect.pro',
                    'minify/proguard-kotlin.pro'

            buildConfigField "String", "DEFAULT_SERVERS_JSON", "\"${getServerJson(false)}\""
            resValue "string", "common_appname", "Ultrasonic"
        }
        debug {
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            applicationIdSuffix = '.debug'
            enableUnitTestCoverage = true
            enableAndroidTestCoverage = true
            matchingFallbacks = ['release']

            buildConfigField "String", "DEFAULT_SERVERS_JSON", "\"${getServerJson(true)}\""
            resValue "string", "common_appname", "Ultrasonic Debug"
        }
    }

    sourceSets {
        main.java.srcDirs += "${projectDir}/src/main/kotlin"
        test.java.srcDirs += "${projectDir}/src/test/kotlin"
        main.assets.srcDirs += "${projectDir}/src/main/assets"
    }

    task copyChangelog(type: Copy) {
        from "${rootDir}/CHANGELOG.md"
        from "${rootDir}/RELEASE_NOTES.md"
        into "${projectDir}/src/main/assets/"
    }

    preBuild.dependsOn copyChangelog

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE']
        }
    }


    buildFeatures {
        viewBinding = true
        dataBinding = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    ksp {
        arg("room.schemaLocation", "$rootDir/ultrasonic/schemas")
    }

    lint {
        baseline = file("lint-baseline.xml")
        checkReleaseBuilds = false
        abortOnError = true
        warningsAsErrors = true
        warning 'ImpliedQuantity'
        disable 'MissingTranslation', 'UnusedQuantity', 'MissingQuantity'
        disable 'ObsoleteLintCustomCheck'
        disable 'NullSafeMutableLiveData'
        // We manage dependencies on Gitlab with RenovateBot
        disable 'GradleDependency'
        disable 'AndroidGradlePluginVersion'
        textReport = true
        checkDependencies = true
    }

    /*
    testOptions {
        managedDevices {
            devices {
                pixel10Pro (ManagedVirtualDevice) {
                    device = "Pixel 7"
                    apiLevel = 35
                    systemImageSource = "aosp-atd"
                }
            }
        }
    }
    */
    namespace = 'org.moire.ultrasonic'

}

