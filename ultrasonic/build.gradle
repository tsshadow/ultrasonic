

import com.android.build.api.dsl.ManagedVirtualDevice

plugins {
    alias libs.plugins.ksp
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    alias(libs.plugins.kotlinSerialization)
    id("kotlin-parcelize")
    id("kotlin-kapt")
    id("androidx.navigation.safeargs.kotlin")
}

apply from: "${project.rootDir}/gradle_scripts/code_quality.gradle"

android {
    def signingProperties = new Properties()
    def envFile = rootProject.file(".env")
    if (envFile.exists()) {
        envFile.withInputStream { signingProperties.load(it) }
    }
    // Fallback to local.properties if it still exists (e.g. created by IDE)
    def localPropsFile = rootProject.file("local.properties")
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { signingProperties.load(it) }
    }

    def envOrProp = { String key, String defVal = null ->
        return System.getenv(key) ?: signingProperties.getProperty(key, defVal)
    }

    compileSdk libs.versions.appCompileSdk.get().toInteger()

    defaultConfig {
        applicationId "org.moire.ultrasonic"
        versionCode 136
        versionName "5.2.1"

        minSdk libs.versions.appMinSdk.get().toInteger()
        targetSdk libs.versions.appTargetSdk.get().toInteger()
        resourceConfigurations += ['cs', 'de', 'en', 'es', 'fr', 'gl', 'hu', 'it', 'ja', 'nb-rNO', 'nl', 'pl', 'pt', 'pt-rBR', 'ru', 'zh-rCN', 'zh-rTW']

        // Inject Default Servers
        buildConfigField "String", "DEFAULT_SERVER_1_NAME", "\"${envOrProp('SERVER_1_NAME', '')}\""
        buildConfigField "String", "DEFAULT_SERVER_1_URL", "\"${envOrProp('SERVER_1_URL', '')}\""
        buildConfigField "String", "DEFAULT_SERVER_1_USER", "\"${envOrProp('SERVER_1_USER', '')}\""
        buildConfigField "String", "DEFAULT_SERVER_1_PASS", "\"${envOrProp('SERVER_1_PASS', '')}\""
        buildConfigField "String", "DEFAULT_SERVER_1_API_KEY", "\"${envOrProp('SERVER_1_API_KEY', '')}\""

        buildConfigField "String", "DEFAULT_SERVER_2_NAME", "\"${envOrProp('SERVER_2_NAME', '')}\""
        buildConfigField "String", "DEFAULT_SERVER_2_URL", "\"${envOrProp('SERVER_2_URL', '')}\""
        buildConfigField "String", "DEFAULT_SERVER_2_USER", "\"${envOrProp('SERVER_2_USER', '')}\""
        buildConfigField "String", "DEFAULT_SERVER_2_PASS", "\"${envOrProp('SERVER_2_PASS', '')}\""
        buildConfigField "String", "DEFAULT_SERVER_2_API_KEY", "\"${envOrProp('SERVER_2_API_KEY', '')}\""

        buildConfigField "String", "APK_HOST_URL", "\"https://apk.teunschriks.nl\""
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    def storeLocation = envOrProp('SIGNING_STORE_FILE', rootProject.file('keystore.jks').path)
    File resolvedStoreFile = null
    if (storeLocation != null) {
        def candidate = new File(storeLocation)
        resolvedStoreFile = candidate.isAbsolute() ? candidate : rootProject.file(storeLocation)
    }

    signingConfigs {
        release {
            if (resolvedStoreFile != null) {
                storeFile resolvedStoreFile
            }
            storePassword envOrProp('SIGNING_STORE_PASSWORD')
            keyAlias envOrProp('SIGNING_KEY_ALIAS')
            keyPassword envOrProp('SIGNING_KEY_PASSWORD')
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            if (this.respondsTo('enableV4Signing')) {
                enableV4Signing true
            }
        }
        debug {
            if (resolvedStoreFile?.exists()) {
                initWith signingConfigs.release
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'minify/proguard-main.pro',
                    'minify/proguard-okhttp.pro',
                    'minify/proguard-retrofit.pro',
                    'minify/proguard-jackson.pro',
                    'minify/proguard-kotlin-reflect.pro',
                    'minify/proguard-kotlin.pro'
        }
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            applicationIdSuffix '.debug'
            enableUnitTestCoverage true
            enableAndroidTestCoverage true
            matchingFallbacks = ['release']
        }
    }

    sourceSets {
        main.java.srcDirs += "${projectDir}/src/main/kotlin"
        test.java.srcDirs += "${projectDir}/src/test/kotlin"
        main.assets.srcDirs += "${projectDir}/src/main/assets"
    }

    task copyChangelog(type: Copy) {
        from "${rootDir}/CHANGELOG.md"
        from "${rootDir}/RELEASE_NOTES.md"
        into "${projectDir}/src/main/assets/"
    }

    preBuild.dependsOn copyChangelog

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE']
        }
    }


    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    ksp {
        arg("room.schemaLocation", "$rootDir/ultrasonic/schemas")
    }

    lint {
        baseline = file("lint-baseline.xml")
        abortOnError true
        warningsAsErrors true
        warning 'ImpliedQuantity'
        disable 'MissingTranslation', 'UnusedQuantity', 'MissingQuantity'
        disable 'ObsoleteLintCustomCheck'
        // We manage dependencies on Gitlab with RenovateBot
        disable 'GradleDependency'
        disable 'AndroidGradlePluginVersion'
        textReport true
        checkDependencies true
    }

    /*
    testOptions {
        managedDevices {
            pixel10Pro (ManagedVirtualDevice) {
                device = "Pixel 10 Pro"
                apiLevel = 35
                systemImageSource = "aosp-atd"
            }
        }
    }
    */
    namespace 'org.moire.ultrasonic'

}

