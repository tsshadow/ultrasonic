// Applies code quality plugins when -Pqc is passed to the gradle
def isCodeQualityEnabled = project.hasProperty('qc')

// KtLint
if (isCodeQualityEnabled) {
    apply plugin: "org.jlleitschuh.gradle.ktlint"

    ktlint {
        outputToConsole = true
        android = true
    }
}

// Detekt
if (isCodeQualityEnabled) {
    if (!project.rootProject.plugins.hasPlugin("io.gitlab.arturbosch.detekt")) {
        Project rootProject = project.rootProject
        rootProject.apply {
            apply plugin: "io.gitlab.arturbosch.detekt"

            // Root detekt configuration
            detekt {
                buildUponDefaultConfig = true
                toolVersion = libs.versions.detekt.get()
                // Use shared detekt configuration
                config.setFrom(files("${rootProject.rootDir}/config/detekt/detekt.yml"))
                // Builds the AST in parallel. Rules are always executed in parallel.
                parallel = true
            }

            // Configure all subprojects' detekt with shared config and module baselines (when present)
            subprojects { subproj ->
                plugins.withId("io.gitlab.arturbosch.detekt") {
                    detekt {
                        buildUponDefaultConfig = true
                        toolVersion = libs.versions.detekt.get()
                        config.setFrom(files("${rootProject.rootDir}/config/detekt/detekt.yml"))
                        def baselineFile = file("${subproj.projectDir}/detekt-baseline.xml")
                        if (baselineFile.exists()) {
                            baseline = baselineFile
                        }
                        parallel = true
                    }
                    tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
                        // Align with Kotlin/JVM target across the build
                        jvmTarget = "21"
                    }
                }
            }
        }
    }
}

apply from: "${project.rootDir}/gradle_scripts/jacoco.gradle"
